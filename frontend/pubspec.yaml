name: safebite_app
description: "Safe-Bite - Tu compañero alimentario seguro"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.1

  # Estado
  provider: ^6.1.2

  # Persistencia local (token de sesion, preferencias)
  shared_preferences: ^2.2.3

  # Escaner de codigos de barras (Lector EAN/UPC)
  mobile_scanner: ^5.1.1

  # Reconocimiento de texto en imagenes (Lector OCR)
  google_mlkit_text_recognition: ^0.13.0

  # Seleccion de imagenes (foto de perfil, camara del escaner manual)
  image_picker: ^1.1.2

  # Mapas para "Ver Restaurante > Ubicacion en mapa"
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilidades de UI
  intl: ^0.19.0
  fl_chart: ^0.68.0

  # Guardar el PDF de reportes exportado por el admin
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
