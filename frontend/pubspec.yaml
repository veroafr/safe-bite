name: safebite_app
description: "Safe-Bite - Tu compañero alimentario seguro"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.1

  # Estado
  provider: ^6.1.2

  # Persistencia local (token de sesion, preferencias)
  shared_preferences: ^2.2.3

  # Escaner de codigos de barras (Lector EAN/UPC)
  mobile_scanner: ^5.1.1

  # Reconocimiento de texto en imagenes (Lector OCR)
  google_mlkit_text_recognition: ^0.13.0

  # Seleccion de imagenes (foto de perfil, camara del escaner manual)
  image_picker: ^1.1.2

  # Mapas para "Ver Restaurante > Ubicacion en mapa"
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilidades de UI
  intl: ^0.19.0
  fl_chart: ^0.68.0

  # Guardar el PDF de reportes exportado por el admin
  path_provider: ^2.1.3

  # Abrir en el navegador la noticia original (noticias importadas por RSS)
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Tipografía de la marca (Plus Jakarta Sans, licencia OFL, incluida en la app)
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
