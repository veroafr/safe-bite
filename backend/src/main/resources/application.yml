server:
  port: ${PORT:8080}

spring:
  application:
    name: safebite-backend

  profiles:
    active: postgres

  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html

safebite:
  jwt:
    secret: ${JWT_SECRET:c2FmZWJpdGUtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0yMDI2LXN1cGVyLWxvbmc=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8081,http://10.0.2.2:8080}
  noticias:
    rss:
      # Importa noticias de Uruguay y Brasil sobre restricciones alimentarias.
      habilitado: ${NOTICIAS_RSS_HABILITADO:true}
      # Vacío = búsquedas de Google Noticias por país. Formato: "UY|url;BR|url"
      feeds: ${NOTICIAS_RSS_FEEDS:}
      intervalo: ${NOTICIAS_RSS_INTERVALO:PT6H}
      demora-inicial: PT2M
      dias-maximos: 60
      maximo-por-canal: 8
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    # Se prueban en orden si el modelo principal no existe o no tiene cuota (404/429).
    modelos-respaldo: ${GEMINI_MODELOS_RESPALDO:gemini-2.5-flash,gemini-2.5-flash-lite}
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${CLAUDE_MODEL:claude-haiku-5-5}
    # USD por millon de tokens. Defaults = Haiku 5.5. Si cambias CLAUDE_MODEL, actualiza estos valores.
    price-in-per-mtok: ${CLAUDE_PRICE_IN:0.10}
    price-out-per-mtok: ${CLAUDE_PRICE_OUT:0.50}
  mail:
    # Remitente de los emails (codigo de "Olvidaste tu contraseña").
    # Para enviar emails de verdad configura el SMTP con variables de entorno:
    #   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD,
    #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
    # Sin SMTP, el codigo se escribe en el log del servidor (util para desarrollo).
    from: ${MAIL_FROM:no-reply@safebite.app}
  spoonacular:
    # Recetas externas filtradas por intolerancia (https://spoonacular.com/food-api).
    api-key: ${SPOONACULAR_API_KEY:}
  ia:
    # Al llegar a este gasto estimado se deja de usar Claude y se usa solo el respaldo (Gemini).
    presupuesto-usd: ${IA_PRESUPUESTO_USD:4.5}
